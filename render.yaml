services:
  - type: web
    name: reviewmate-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MODEL_BACKEND
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: reviewmate-db
          property: connectionString

databases:
  - name: reviewmate-db
    plan: free
    region: oregon
